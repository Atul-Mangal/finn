# Push side: fetch EOD prices + exchange filings, classify, enrich, commit.
# The commit triggers a Vercel redeploy, so the phone always opens to fresh,
# pre-computed data and never waits on a scraper.
name: Refresh data

on:
  schedule:
    # Hourly through Indian market hours (09:00–17:00 IST), weekdays — filings land intraday
    - cron: "30 3-11 * * 1-5"
    # After close, once EOD prices are final (19:00 IST)
    - cron: "30 13 * * 1-5"
  workflow_dispatch:
    inputs:
      window_days:
        description: "Days of filings to fetch"
        default: "30"

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          WINDOW_DAYS: ${{ github.event.inputs.window_days || '30' }}
        run: npm run pipeline
      - name: Commit data
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          git add public/data data/cache.json
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "data: refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash
          git push
