# Pull side: precompute research for the demo tickers so they open instantly.
# Any other ticker is researched live in the app.
name: Prefetch research

on:
  schedule:
    - cron: "0 15 * * 0" # weekly, Sunday evening IST
  workflow_dispatch:
    inputs:
      symbols:
        description: "Space-separated NSE symbols (blank = demo set)"
        default: ""

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prefetch
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run prefetch -- ${{ github.event.inputs.symbols }}
      - name: Commit
        # Re-apply this job's outputs on top of the latest main (no merge conflicts).
        run: |
          git config user.name "finn-bot"
          git config user.email "finn-bot@users.noreply.github.com"
          mkdir -p /tmp/out && cp -r public/data/research /tmp/out/ && cp data/research-cache.json data/models.json /tmp/out/
          for i in 1 2 3; do
            git fetch -q origin main && git reset -q --hard origin/main
            mkdir -p public/data/research && cp -r /tmp/out/research/. public/data/research/ && cp /tmp/out/research-cache.json /tmp/out/models.json data/
            git add public/data/research data/research-cache.json data/models.json
            if git diff --cached --quiet; then echo "no changes"; exit 0; fi
            git commit -qm "data: research snapshots $(date -u +%Y-%m-%d)"
            git push -q && exit 0
            sleep 5
          done
          exit 1
